<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eu Te Amo 💕</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="fireworksCanvas"></canvas>
    
    <div class="container">
        <div class="content">
            <h1 class="title">Eu Te Amo</h1>
            <h2 class="subtitle">Meu Amor</h2>
            <p class="message">Para Sempre ❤️</p>
            
            <div class="proposal-box">
                <p class="proposal-text">Quer se casar comigo? 💍</p>
                <div class="button-group">
                    <button class="btn yes-btn" onclick="celebrate()">SIM! 💕</button>
                    <button class="btn no-btn" onclick="moveButton(event)">Não</button>
                </div>
            </div>
        </div>
    </div>

    <script src="fireworks.js"></script>
    <script src="script.js"></script>
</body>
</html>
